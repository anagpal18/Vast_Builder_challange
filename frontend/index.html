<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOOKOUT</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d12'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff6b3d'/%3E%3C/svg%3E" />
    <script>
      // Behind a path prefix (k8s Ingress /app) relative asset URLs need a trailing slash: /app → /app/
      if (!location.pathname.endsWith('/') && !/\.[a-z0-9]+$/i.test(location.pathname))
        location.replace(location.pathname + '/' + location.search + location.hash)
    </script>
  </head>
  <body class="bg-ink text-fog">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
